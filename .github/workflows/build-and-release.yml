name: Build & Package ODX Engine (macOS arm64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ODX Tag or Commit SHA'
        required: true
        default: 'v3.8.4'
      version_tag:
        description: 'Release Tag Name (e.g. v3.8.4)'
        required: true
        default: 'v3.8.4'
      overwrite:
        description: 'Overwrite existing release with same tag'
        type: boolean
        default: true
      draft:
        description: 'Publish as Draft Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Build & Release ODX Engine
    runs-on: macos-14 # Apple Silicon M1 Runner

    steps:
      - name: Checkout Packaging Repository
        uses: actions/checkout@v4

      - name: Determine Target Version & Ref
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            REF="${{ github.event.inputs.upstream_ref }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            REF="$TAG"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "REF=$REF" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $TAG"
          echo "Upstream Git Ref:   $REF"

      - name: Check & Clean Existing Release
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.TAG }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub. Deleting to publish fresh replacement."
            gh release delete "$TAG" --yes --cleanup-tag=false || true
          fi
          echo "EXISTS=false" >> $GITHUB_OUTPUT

      - name: Setup Micromamba Environment
        if: steps.check_release.outputs.EXISTS == 'false'
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: Config/environment.yml
          environment-name: odx-build-env
          cache-environment: true

      - name: Clone Upstream ODX & Resolve Commit SHA
        id: git_info
        if: steps.check_release.outputs.EXISTS == 'false'
        run: |
          mkdir -p .build
          git clone --no-checkout https://github.com/WebODM/ODX.git .build/ODX
          git -C .build/ODX checkout --detach "${{ steps.vars.outputs.REF }}"
          git -C .build/ODX submodule update --init --recursive
          
          # Resolve and export the exact Git commit SHA
          COMMIT="$(git -C .build/ODX rev-parse HEAD)"
          echo "COMMIT=$COMMIT" >> $GITHUB_OUTPUT
          echo "Target ref '${{ steps.vars.outputs.REF }}' resolved to commit: $COMMIT"

      - name: Install Runtime Python Dependencies
        if: steps.check_release.outputs.EXISTS == 'false'
        run: |
          PREFIX="$MAMBA_ROOT_PREFIX/envs/odx-build-env"
          export PYTHONNOUSERSITE=1
          
          # Install pure-Python dependencies without overriding conda-forge native packages
          micromamba run -n odx-build-env python -m pip install \
            --no-deps \
            ODMExifRead vmem pyodm Pysolar fpdf2 piexif edt pygltflib

      - name: Compile Native SuperBuild Modules
        if: steps.check_release.outputs.EXISTS == 'false'
        run: |
          PREFIX="$MAMBA_ROOT_PREFIX/envs/odx-build-env"
          export PYTHONNOUSERSITE=1
          export CMAKE_BUILD_PARALLEL_LEVEL=3
          export CMAKE_PREFIX_PATH="$PREFIX"
          export CMAKE_POLICY_VERSION_MINIMUM=3.5

          # 1. Patch SuperBuild to cleanly register pre-installed conda native libraries
          python3 -c "
          from pathlib import Path
          
          setup_cmake = Path('.build/ODX/SuperBuild/cmake/ExternalProject-Setup.cmake')
          new_setup = '''set(ADD_INTERNAL_LIB_MSG \"--- Adding internal version\")
          set(FORCE_BUILD_LIB_MSG \"force build \${ADD_INTERNAL_LIB_MSG}\")
          cmake_policy(SET CMP0135 NEW)

          macro(SETUP_EXTERNAL_PROJECT name version force_build)
            if(NOT \${force_build})
              find_package(\${name} QUIET)
              if(\${\${name}_FOUND})
                message(STATUS \"\${name} found via system/conda\")
                set(\${name}_DIR \${\${name}_DIR})
                string(TOLOWER \"\${name}\" _name_lower)
                if(NOT TARGET \${_name_lower})
                  add_custom_target(\${_name_lower})
                endif()
              else()
                include(External-\${name})
              endif()
            else()
              include(External-\${name})
            endif()
          endmacro()

          macro(SETUP_EXTERNAL_PROJECT_CUSTOM name)
            include(External-\${name})
          endmacro()
          '''
          setup_cmake.write_text(new_setup)
          
          sb_cmake = Path('.build/ODX/SuperBuild/CMakeLists.txt')
          sb_content = sb_cmake.read_text()
          dummy_targets = '''
          foreach(dep opencv ceres gflags)
            if(NOT TARGET \${dep})
              add_custom_target(\${dep})
            endif()
          endforeach()
          '''
          sb_content = sb_content.replace(
              'SETUP_EXTERNAL_PROJECT(Ceres \${ODM_Ceres_Version} \${ODM_BUILD_Ceres})',
              'SETUP_EXTERNAL_PROJECT(Ceres \${ODM_Ceres_Version} \${ODM_BUILD_Ceres})\n' + dummy_targets
          )
          sb_cmake.write_text(sb_content)
          "

          # 2. Configure SuperBuild and compile core tools
          cd .build/ODX/SuperBuild
          mkdir -p build && cd build
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DODM_BUILD_OpenCV=OFF \
            -DODM_BUILD_Ceres=OFF \
            -DODM_BUILD_GFlags=OFF
            
          cmake --build . --target odm_orthophoto dem2mesh dem2points -j3 || echo "SuperBuild partial finish"

          # 3. Setup OpenSfM in ODX SuperBuild tree
          cd ../../../..
          mkdir -p .build/ODX/SuperBuild/install/bin
          if [ ! -d ".build/ODX/SuperBuild/install/bin/opensfm" ]; then
            git clone --depth 1 https://github.com/WebODM/OpenSfM.git .build/ODX/SuperBuild/install/bin/opensfm
            git -C .build/ODX/SuperBuild/install/bin/opensfm submodule update --init --recursive
          fi

          micromamba run -n odx-build-env /usr/bin/env \
            CC=/usr/bin/clang CXX=/usr/bin/clang++ LD=/usr/bin/ld \
            CFLAGS="-O2 -fPIC -I$PREFIX/include" \
            CXXFLAGS="-O2 -fPIC -stdlib=libc++ -I$PREFIX/include" \
            LDFLAGS="-L$PREFIX/lib -Wl,-rpath,$PREFIX/lib -fuse-ld=/usr/bin/ld" \
            CMAKE_ARGS="-DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DCMAKE_LINKER=/usr/bin/ld -DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib -DCMAKE_PREFIX_PATH=$PREFIX -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0" \
            python -m pip install --no-deps --no-build-isolation -e .build/ODX/SuperBuild/install/bin/opensfm

      - name: Smoke Test ODX Environment & CLI
        if: steps.check_release.outputs.EXISTS == 'false'
        run: |
          echo "=== Testing ODX core Python imports ==="
          micromamba run -n odx-build-env python -c "
          import sys
          sys.path.insert(0, '.build/ODX')
          import rasterio
          import cv2
          import numpy
          import scipy
          import PIL
          import yaml
          import shapely
          import pyproj
          from stages.odm_app import ODMApp
          print('ODX imports verified successfully!')
          "
          echo "=== Testing ODX entrypoint execution ==="
          micromamba run -n odx-build-env python .build/ODX/run.py --help > /dev/null
          echo "ODX CLI smoke test passed!"

      - name: Relink Mach-O Binaries & Prune Development Headers
        if: steps.check_release.outputs.EXISTS == 'false'
        run: |
          PREFIX="$MAMBA_ROOT_PREFIX/envs/odx-build-env"
          python3 Scripts/prepare-distribution-engine.py \
            --runtime "$PREFIX" \
            --odx .build/ODX \
            --version "${{ steps.vars.outputs.TAG }}" \
            --commit "${{ steps.git_info.outputs.COMMIT }}" \
            --output .build/dist \
            --adhoc

      - name: Compress Engine Archive
        if: steps.check_release.outputs.EXISTS == 'false'
        run: |
          cd .build/dist
          tar -czf ../../OrthomosaicEngine-macOS-arm64.tar.gz OrthomosaicEngine OrthomosaicPython
          cd ../..
          shasum -a 256 OrthomosaicEngine-macOS-arm64.tar.gz > OrthomosaicEngine-macOS-arm64.tar.gz.sha256
          
          echo "Archive size: $(du -sh OrthomosaicEngine-macOS-arm64.tar.gz | awk '{print $1}')"
          echo "SHA256: $(cat OrthomosaicEngine-macOS-arm64.tar.gz.sha256)"

      - name: Create GitHub Release
        if: steps.check_release.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: "ODX macOS arm64 Runtime ${{ steps.vars.outputs.TAG }}"
          body: |
            ## ODX Pre-compiled Engine for macOS Apple Silicon
            - **Release Version**: `${{ steps.vars.outputs.TAG }}`
            - **ODX Upstream Commit SHA**: `${{ steps.git_info.outputs.COMMIT }}`
            - **Architecture**: `macOS arm64` (Apple Silicon M1/M2/M3/M4)
            - **Deployment Target**: `macOS 14.0+`
            - **SHA-256 Checksum**: `$(cat OrthomosaicEngine-macOS-arm64.tar.gz.sha256 | awk '{print $1}')`
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: false
          files: |
            OrthomosaicEngine-macOS-arm64.tar.gz
            OrthomosaicEngine-macOS-arm64.tar.gz.sha256
